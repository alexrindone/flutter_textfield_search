# This is a basic workflow to help you get started with Actions

name: Build and Tests

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    #    types: [opened, reopened]
    paths-ignore:
      - 'coverage/**'
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Run Tests
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    permissions:
      contents: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter pub get
          flutter analyze
          flutter test --coverage
          bash test-coverage.sh
           # Only update coverage files during a Pull Request
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git status
            git add .
            git config user.email "arindone@artistryfair.com"
            git config user.name "Alex Rindone"
            git commit --allow-empty -m "auto updating coverage.json and lcov.info"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

